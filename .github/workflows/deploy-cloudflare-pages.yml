name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: mxzulin
  PRODUCTION_BRANCH: main
  DEFAULT_SITE_URL: https://mxzulin.com

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          SITE_URL="${SITE_URL:-$DEFAULT_SITE_URL}" npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages project create "$PROJECT_NAME" --production-branch "$PRODUCTION_BRANCH" || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist --project-name "$PROJECT_NAME" --branch "$PRODUCTION_BRANCH"

      - name: Ensure custom domain is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-$DEFAULT_SITE_URL}"
          DOMAIN="${SITE_URL#http://}"
          DOMAIN="${DOMAIN#https://}"
          DOMAIN="${DOMAIN%%/*}"

          if [ -z "$DOMAIN" ]; then
            echo "No domain configured; skipping custom domain setup."
            exit 0
          fi

          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains"
          RESPONSE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE" -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${API_BASE}/${DOMAIN}")"

          if [ "$STATUS" = "200" ]; then
            echo "Custom domain ${DOMAIN} is already attached."
            cat "$RESPONSE"
            exit 0
          fi

          if [ "$STATUS" != "404" ]; then
            echo "Could not verify custom domain ${DOMAIN}; Cloudflare returned HTTP ${STATUS}."
            cat "$RESPONSE"
            exit 1
          fi

          curl -sS --fail \
            -X POST "$API_BASE" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${DOMAIN}\"}"
